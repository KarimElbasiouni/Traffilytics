# One process: FastAPI serves the built dashboard, SQLite, and the in-process worker.
# No container image. Connect this repo on Render and apply the blueprint.
services:
  - type: web
    name: traffilytics
    runtime: python
    plan: free
    buildCommand: bash scripts/build_public.sh
    startCommand: python scripts/run_api.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
