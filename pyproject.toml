# pyproject.toml — package metadata for Traffilytics.
# Used by `pip install -e .` so computer_vision/, analytics/, backend/, and adapters/
# import as installable packages. Optional extras: [dev], [ml], [api].

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traffilytics"
version = "0.1.0"
description = "AI Traffic Intelligence Platform — detect, track, analyze drone traffic video"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Traffilytics" }]
dependencies = [
  "opencv-python>=4.8",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "tqdm>=4.66",
  "pillow>=10.0",
  "huggingface_hub>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
ml = ["torch", "torchvision", "ultralytics>=8.1"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "sqlalchemy>=2.0", "pydantic>=2.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "computer_vision*",
  "analytics*",
  "backend*",
  "adapters*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
