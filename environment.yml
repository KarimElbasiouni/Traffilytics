# Traffilytics Conda environment (CPU-friendly for local WSL / laptops).
# For YOLO OBB training (Epic 2), use a CUDA-capable host and install
# a matching pytorch-cuda build (see README).

name: traffilytics
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy>=1.24
  - pyyaml>=6.0
  - pillow>=10.0
  - tqdm>=4.66
  - pytest>=7.4
  - pip:
      - opencv-python>=4.8
      - python-dotenv>=1.0
      - huggingface_hub>=0.20
      # Later epics (CPU torch for import/smoke; use CUDA build on GPU hosts)
      - torch
      - torchvision
      - ultralytics>=8.1
      - fastapi>=0.110
      - uvicorn[standard]>=0.27
      - sqlalchemy>=2.0
      - pydantic>=2.0
      - httpx>=0.27
