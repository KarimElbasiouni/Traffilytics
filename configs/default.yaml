# Traffilytics default configuration (paths relative to repo root)

data:
  root: ./data
  raw: ./data/raw
  annotations: ./data/annotations
  # DRIFT GT CSVs — Epic 3 benchmarking only; unused for detection train/eval/infer
  gt_trajectories: ./data/gt_trajectories
  processed: ./data/processed

video:
  # Prefer DRIFT stabilized clips when available (stabilization itself is not a focus)
  prefer_stabilized: true
  extensions: [".mp4", ".avi", ".mov", ".mkv"]
  # Extract every Nth frame for 4K throughput (NFR-PERF-002); set to 1 for all frames
  frame_stride: 5
  # Optional max frames for smoke / debug (null = no limit)
  max_frames: null
  # Image format for extracted frames
  frame_image_format: "jpg"
  jpeg_quality: 90

ingest:
  default_source: drift
  # If true, treat path/name hints containing "stabil" as stabilized=true
  infer_stabilized_from_name: true

drift:
  # Hugging Face dataset id
  hf_dataset: Hj-Lee/The-DRIFT
  # Local layout under data/
  raw_subdir: raw
  annotations_subdir: annotations
  gt_trajectories_subdir: gt_trajectories

models:
  root: ./models
  configs: ./models/configs
  # Traffilytics-trained product weights (copied from Ultralytics best.pt after train)
  weights: ./models/your_obb.pt

# Inference / eval defaults for VehicleDetector, scripts/detect_frames.py, and
# scripts/eval_obb.py. Training hyperparameters live in models/configs/train_obb.yaml.
# Product path loads only models/your_obb.pt (NFR-ACC-004). DRIFT best.pt is an
# optional eval --baseline comparison only — never the product model.
# GT trajectory CSVs (data.gt_trajectories) are unused until Epic 3 benchmarking.
detection:
  weights: ./models/your_obb.pt
  conf_threshold: 0.25   # FR-DET-004 scores below this are dropped
  iou_threshold: 0.7
  imgsz: 640
  device: auto           # cuda if available else cpu
  allow_pretrained: false  # wiring only; never the product default (not FR-DET-001)
