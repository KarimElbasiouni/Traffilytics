# Traffilytics default configuration (paths relative to repo root)

data:
  root: ./data
  raw: ./data/raw
  # UAV-OBB train/valid/test split tree (see scripts/prepare_obb_dataset.py)
  annotations: ./data/annotations
  processed: ./data/processed

video:
  # Order pre-stabilized clips first when present; stabilization is not implemented
  prefer_stabilized: true
  extensions: [".mp4", ".avi", ".mov", ".mkv"]
  # Extract every Nth frame for throughput (NFR-PERF-002); set to 1 for all frames.
  # At a 30 fps source, stride 2 leaves ~15 effective fps, which keeps per-frame
  # vehicle displacement small enough for IoU-based association. Larger strides
  # process faster but degrade tracking (Epic 3). Override per run with --stride.
  frame_stride: 2
  # Optional max frames for smoke / debug (null = no limit)
  max_frames: null
  # Image format for extracted frames
  frame_image_format: "jpg"
  jpeg_quality: 90

ingest:
  default_source: upload
  # If true, treat path/name hints containing "stabil" as stabilized=true
  infer_stabilized_from_name: true

models:
  root: ./models
  configs: ./models/configs
  # Traffilytics-trained product weights (copied from Ultralytics best.pt after train)
  weights: ./models/your_obb.pt

# Inference / eval defaults for VehicleDetector, scripts/detect_frames.py, and
# scripts/eval_obb.py. Training hyperparameters live in models/configs/train_obb.yaml.
# Product path loads only models/your_obb.pt (NFR-ACC-004). Another OBB checkpoint
# may be passed as an eval --baseline for comparison only — never as the product
# model — and its mAP is comparable only if its classes match the dataset's six.
detection:
  weights: ./models/your_obb.pt
  conf_threshold: 0.25   # FR-DET-004 scores below this are dropped
  iou_threshold: 0.7
  imgsz: 640
  device: auto           # cuda if available else cpu
  allow_pretrained: false  # wiring only; never the product default (not FR-DET-001)

# ByteTrack defaults for VehicleTracker / scripts/track_video.py (Epic 3).
# Association uses each OBB's axis-aligned envelope; stored pose stays OBB.
tracking:
  tracker: bytetrack
  track_high_thresh: 0.25
  track_low_thresh: 0.1
  new_track_thresh: 0.25
  track_buffer: 30
  match_thresh: 0.8
  fuse_score: true
  # Drop tracks seen on fewer frames than this when writing trajectories.json
  min_hits: 1
  # Overlay video fps (ingested frames, not source fps)
  overlay_fps: 10
  # Handoff proxy for suspected ID switches (pixels / frame-steps; no GT)
  id_switch_max_gap: 5
  id_switch_max_dist: 80

# Per-video lane/zone polygons (FR-TRK-006). Missing file → lane stays null.
lanes:
  dir: ./configs/lanes

# Analytics engine (Epic 4). Speed/density stay pixel-labelled unless
# pixels_per_metre is set here or passed as --pixels-per-metre (FR-FLOW-005).
analytics:
  window_seconds: 2.0
  pixels_per_metre: null
  stopped_speed_px_s: 8.0
  stopped_speed_m_s: 0.5
  stopped_min_seconds: 1.5
  free_speed_quantile: 0.85
  congested_speed_ratio: 0.5
  sudden_speed_drop: 0.4
  queue_fraction: 0.5
  heatmap_rows: 12
  heatmap_cols: 12


