# Traffilytics default configuration (paths relative to repo root)

data:
  root: ./data
  raw: ./data/raw
  # UAV-OBB train/valid/test split tree (see scripts/prepare_obb_dataset.py)
  annotations: ./data/annotations
  processed: ./data/processed

video:
  # Order pre-stabilized clips first when present; stabilization is not implemented
  prefer_stabilized: true
  extensions: [".mp4", ".avi", ".mov", ".mkv"]
  # Extract every Nth frame for throughput (NFR-PERF-002); set to 1 for all frames.
  # Keep low for tracking: Epic 3 association degrades at sparse effective fps.
  frame_stride: 5
  # Optional max frames for smoke / debug (null = no limit)
  max_frames: null
  # Image format for extracted frames
  frame_image_format: "jpg"
  jpeg_quality: 90

ingest:
  default_source: upload
  # If true, treat path/name hints containing "stabil" as stabilized=true
  infer_stabilized_from_name: true

models:
  root: ./models
  configs: ./models/configs
  # Traffilytics-trained product weights (copied from Ultralytics best.pt after train)
  weights: ./models/your_obb.pt

# Inference / eval defaults for VehicleDetector, scripts/detect_frames.py, and
# scripts/eval_obb.py. Training hyperparameters live in models/configs/train_obb.yaml.
# Product path loads only models/your_obb.pt (NFR-ACC-004). A public pretrained
# OBB checkpoint may be passed as an eval --baseline for comparison only —
# never as the product model.
detection:
  weights: ./models/your_obb.pt
  conf_threshold: 0.25   # FR-DET-004 scores below this are dropped
  iou_threshold: 0.7
  imgsz: 640
  device: auto           # cuda if available else cpu
  allow_pretrained: false  # wiring only; never the product default (not FR-DET-001)
