# Ultralytics YOLO OBB training config for Traffilytics (Epic 2)
# Point `data` at a generated data.yaml from adapters.drift.obb_annotations
# or at data/annotations after downloading samples.

# Model: start from a YOLO OBB checkpoint architecture (train YOUR weights)
model: yolov8n-obb.pt

# Dataset YAML (absolute or repo-relative). Generated by:
#   python scripts/prepare_obb_dataset.py
data: models/configs/drift_obb_data.yaml

# Training hyperparameters (tune on a CUDA host)
epochs: 50
imgsz: 640
batch: 8
device: 0
workers: 4
project: models/runs
name: obb_v1
exist_ok: true
patience: 20
save: true
plots: true

# Classes (must match DRIFT)
# 0: bus, 1: car, 2: truck
