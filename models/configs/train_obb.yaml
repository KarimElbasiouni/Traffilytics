# Ultralytics YOLO OBB training config for Traffilytics (Epic 2)
# Point `data` at a data.yaml generated by scripts/prepare_obb_dataset.py,
# or at the data.yaml that ships inside the UAV-OBB download.

# Model: start from a YOLO OBB checkpoint architecture (train YOUR weights)
model: yolov8n-obb.pt

# Dataset YAML (absolute or repo-relative). Generated by:
#   python scripts/prepare_obb_dataset.py
data: models/configs/uav_obb_data.yaml

# Training hyperparameters (tune on a CUDA host)
epochs: 50
imgsz: 640
batch: 8
device: 0
workers: 4
project: models/runs
name: obb_v1
exist_ok: true
patience: 20
save: true
plots: true

# Classes (must match the UAV-OBB data.yaml)
# 0: bike, 1: bus, 2: car, 3: other_vehicle, 4: taxi, 5: truck
